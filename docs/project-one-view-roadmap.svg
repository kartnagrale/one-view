  <text x="499" y="1058" class="white" font-size="12" font-weight="700">2</text>
  <text x="854" y="1058" class="white" font-size="12" font-weight="700">3</text>
  <text x="1209" y="1058" class="white" font-size="12" font-weight="700">4</text>
  <text x="83" y="1028" class="label" fill="#1f725f">FOUNDATION</text>
  <text x="83" y="1092" class="node-title">Connect + normalize</text>
