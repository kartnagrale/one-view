  <text x="620" y="678" font-size="11" font-weight="700" fill="#245b4e">ROLE_INTERNAL</text>
  <text x="78" y="738" class="label" fill="#58736c">SHARED WORKSPACE</text>
  <text x="78" y="773" class="node-title">Overview</text>
  <text x="78" y="796" class="node-copy">KPIs, map, trends, filters</text>
  <text x="78" y="837" class="node-title">Auctions</text>
