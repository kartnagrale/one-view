  <text x="1353" y="678" font-size="11" font-weight="700" fill="#80501e">INTERNAL + MARKETWATCH</text>
  <text x="830" y="738" class="label" fill="#58736c">SAME SHARED ANALYTICS</text>
  <text x="830" y="773" class="node-title">Overview</text>
  <text x="830" y="796" class="node-copy">KPIs, map, trends, filters</text>
  <text x="830" y="837" class="node-title">Auctions</text>
  <text x="830" y="860" class="node-copy">Forward / Reverse discovery</text>
  <text x="1069" y="773" class="node-title">Participants</text>
  <text x="1069" y="796" class="node-copy">Registered + participating</text>
  <text x="1069" y="837" class="node-title">Reports + AI</text>
  <text x="1069" y="860" class="node-copy">Analysis, export, assistant</text>
  <rect x="1293" y="727" width="229" height="151" rx="10" fill="#fff4df" stroke="#ecd5aa"/>
  <text x="1312" y="756" class="label" fill="#9a6225">EXTRA CAPABILITY</text>
  <text x="1312" y="786" class="node-title">Mapping Console</text>
  <text x="1312" y="812" class="node-copy">Manage business labels</text>
  <text x="1312" y="834" class="node-copy">Create / update / delete</text>
  <text x="1312" y="858" class="small">API enforces MARKETWATCH</text>

  <text x="64" y="972" class="section">3 / Current platform + next priorities</text>
  <rect x="48" y="994" width="1504" height="164" rx="16" fill="#fff" filter="url(#shadow)"/>
  <path d="M150 1053H1435" stroke="#b6c9c1" stroke-width="3" marker-end="url(#arrow)"/>
