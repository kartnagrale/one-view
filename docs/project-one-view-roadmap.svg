  <text x="566" y="847" class="small">Authenticated internal users</text>
  <text x="566" y="865" class="small">can view participant PII.</text>

  <rect x="800" y="643" width="752" height="277" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="800" y="643" width="752" height="60" rx="16" fill="#9a6225"/>
  <path d="M800 686h752v17H800z" fill="#9a6225"/>
